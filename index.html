    <script>
      // Extension compatibility shim: allow extensions to assign window.fetch without throwing
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch ? origFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
